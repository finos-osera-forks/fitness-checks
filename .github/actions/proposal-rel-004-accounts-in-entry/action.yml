name: CP-REL-004-03
description: "CP-REL-004-03 (REL-004 0.1.0): a check of ours (remediation-standards 52): the account that pushed the tag and the accounts on the commits between the baseline tag and the release tag are all in that producer entry's github_users. Advisory, never fails the run"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: CP-REL-004-03
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is REL-004 0.1.0 CP-REL-004-03 ""
        F=.osera/patch-evidence.yaml
        expect "tag pusher and all commit accounts are in the producer's github_users"

        # 1. the evidence file, the producer, and the accounts its entry allows (a check of ours: a fail is advisory, never the run's)
        step "reading $F and the approved producers file"
        if [ ! -f "$F" ]; then
          record fail "$F: absent"
          exit 0
        fi
        P="$(ev yq -r '.producer // ""' "$F")"
        ALLOWED="$(P="$P" ev yq -r '.producers[] | select(.id == env(P)) | .github_users[]' "$OSERA_APPROVED_PRODUCERS" | sort -u)"
        if [ -z "$ALLOWED" ]; then
          record fail "tag pusher: $OSERA_ACTOR; github_users of ${P:-the producer}: absent"
          exit 0
        fi
        expect "tag pusher and all commit accounts are in $P's github_users: $(listed "$ALLOWED")"

        # 2. without the baseline tag there is no range of commits: the check stops and is recorded as fail (failed step)
        step "resolving the baseline tag $BASE"
        ev git rev-parse -q --verify "refs/tags/${BASE}^{commit}" >/dev/null

        # 3. the accounts: who pushed the tag (run context), and the author and committer of every commit in the range (API)
        step "reading the accounts behind the commits from the GitHub API"
        SHAS="$(ev git rev-list "${BASE}..${OSERA_TAG}")"
        COMMIT_ACCOUNTS=""
        for S in $SHAS; do
          COMMIT_ACCOUNTS="$COMMIT_ACCOUNTS $(ev gh api "repos/${OSERA_REPOSITORY}/commits/${S}" --jq '[.author.login, .committer.login] | map(select(. != null and . != "web-flow")) | join(" ")')"
        done
        COMMIT_ACCOUNTS="$(tr ' ' '\n' <<<"$COMMIT_ACCOUNTS" | grep -v '^$' | sort -u || true)"
        ACCOUNTS="$(printf '%s\n%s\n' "$OSERA_ACTOR" "$COMMIT_ACCOUNTS" | grep -v '^$' | sort -u)"

        # 4. every account must be in the entry
        IN="$(comm -12 <(echo "$ACCOUNTS") <(echo "$ALLOWED"))"
        NOT_IN="$(comm -23 <(echo "$ACCOUNTS") <(echo "$ALLOWED"))"
        ROW="tag pusher: $OSERA_ACTOR; commit accounts: $(listed "$COMMIT_ACCOUNTS"); in github_users: $(counted "$IN"); not in github_users: $(counted "$NOT_IN")"
        if [ -n "$NOT_IN" ]; then
          record fail "$ROW"
        else
          record pass "$ROW"
        fi
