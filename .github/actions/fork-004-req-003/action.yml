name: FORK-004.REQ-003 (observe)
description: "FORK-004.REQ-003 (FORK-004 0.0.1): Patched-source repositories must be hosted in the appropriate official OSERA fork for the upstream project or artifact line. Observe only: kept out of the result, never fails the run"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: FORK-004.REQ-003 (observe)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is FORK-004 0.0.1 FORK-004.REQ-003 FORK-004.CHECK-003
        OWNER="${OSERA_REPOSITORY%%/*}"
        expect "repository $OSERA_REPOSITORY is in the organisation $OSERA_EXPECTED_ORG and is a GitHub fork of an upstream repository"

        # 1. the fork flag from the run context when GitHub set it
        if [ -n "$OSERA_IS_FORK" ]; then
          given github.event.repository.fork "$OSERA_IS_FORK"
        fi

        # 2. the fork relationship from the GitHub API, one call: the fork flag, the parent it was forked from
        #    and the root of the fork network
        step "reading the fork relationship from the GitHub API"
        FORK="$(ev gh api "repos/$OSERA_REPOSITORY" --jq '"\(.fork) \(.parent.full_name // "none") \(.source.full_name // "none")"')"
        read -r IS_FORK PARENT SOURCE <<<"$FORK"

        # 3. the official organisation
        if [ "$OWNER" != "$OSERA_EXPECTED_ORG" ]; then
          record fail "repository is in $OWNER, not in the official organisation $OSERA_EXPECTED_ORG"
          exit 0
        fi

        # 4. a GitHub fork of an upstream repository. The standard does not say yet which upstream repository is the
        #    appropriate one for an artifact line, so the parent is recorded here, not judged.
        if [ "$IS_FORK" != "true" ]; then
          record fail "repository is in $OSERA_EXPECTED_ORG but is not a GitHub fork, it has no fork relationship to an upstream repository"
        else
          record pass "repository is in $OSERA_EXPECTED_ORG and is a GitHub fork of $PARENT (root of the fork network: $SOURCE); whether that is the appropriate upstream repository is not defined by the standard yet"
        fi
