name: SRC-001.REQ-001 (observe)
description: "SRC-001.REQ-001 (SRC-001 0.0.1): Patch providers should classify whether each CVE or fix item in a patch release is based on an upstream fix, an adapted upstream fix, or a provider-developed fix, using a vocabulary still to be defined by the working group. Observe only: reported, never fails the run"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: SRC-001.REQ-001 (observe)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is SRC-001 0.0.1 SRC-001.REQ-001 SRC-001.CHECK-001
        F=.osera/patch-evidence.yaml
        expect "each fix in the evidence file has a basis"

        # Our proposal, the standard defines no field: the basis of a fix is read from fixes[].basis (a word, or a map
        # with a type, as in the standards repository's evidence example), else from patch.basis.type, the basis of the
        # whole release (the field of that example), which counts for every fix. The vocabulary is not defined, so a
        # value is never judged: the check passes when every fix has one, by either route (Francesco, 30 Oct 2026),
        # severity observe.

        # 1. the evidence file must be in the repository at the tag
        step "reading $F"
        if [ ! -f "$F" ]; then
          record fail "$F: absent"
          exit 0
        fi

        # 2. one line per fix: the CVE (or the upstream link when there is no CVE) and the basis, the fix's own or the
        #    release's, - when neither is there. The upstream link is upstream_fix_url, else advisory_url (the SRC-002
        #    fields), else the earlier upstream field
        RELEASE_BASIS="$(ev yq -r '.patch.basis.type // "-"' "$F")"
        FIXES="$(B="$RELEASE_BASIS" ev yq -r '.fixes // [] | .[] | (.cve // .upstream_fix_url // .advisory_url // .upstream // "-") + " " + ((.basis.type // .basis) // strenv(B))' "$F")"
        if [ -z "$FIXES" ]; then
          record fail "fixes: 0"
          exit 0
        fi

        # 3. the fixes with a basis, and the ones without
        N="$(wc -l <<<"$FIXES" | tr -d ' ')"
        WITH="$(awk '$2 != "-"' <<<"$FIXES")"
        WITHOUT="$(awk '$2 == "-" {print $1}' <<<"$FIXES")"
        ROW="fixes: $N; with a basis: $(counted "$WITH"); without a basis: $(counted "$WITHOUT")"
        if [ -n "$WITHOUT" ]; then
          record fail "$ROW"
        else
          record pass "$ROW"
        fi
