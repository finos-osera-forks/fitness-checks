name: EVD-001.REQ-001 (observe)
description: "EVD-001.REQ-001 (EVD-001 0.0.1): Patch providers should publish versioned recipient guidance describing what changed and what surface area should be tested. Observe only: reported, never fails the run"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: EVD-001.REQ-001 (observe)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is EVD-001 0.0.1 EVD-001.REQ-001 EVD-001.CHECK-001
        F=.osera/patch-evidence.yaml
        SCHEMA=.osera-standards/docs/schemas/osera-recipient-guidance-0.1.0.schema.json
        expect "$F has recipient_guidance or patch.recipient_guidance, valid against ${SCHEMA##*/}"

        # Our proposal, the standard does not decide where the guidance is published (feeds, release notes, repository
        # files or evidence bundles): it is looked for in $F, at recipient_guidance (the standard's suggested schema)
        # or at patch.recipient_guidance (the standards repository's evidence example). Severity observe: the row never
        # changes the result.

        # 1. the schema, from the standards repository at the pack ref
        step "reading the schema $SCHEMA"
        if [ ! -f "$SCHEMA" ]; then
          record fail "${SCHEMA##*/}: absent"
          exit 0
        fi

        # 2. the evidence file must be in the repository at the tag
        step "reading $F"
        if [ ! -f "$F" ]; then
          record fail "$F: absent"
          exit 0
        fi

        # 3. the guidance, at either place, as JSON
        TOP="$(ev yq -o=json -I=0 '.recipient_guidance // null' "$F")"
        UNDER_PATCH="$(ev yq -o=json -I=0 '.patch.recipient_guidance // null' "$F")"
        ROW="recipient_guidance: $(if [ "$TOP" = "null" ]; then echo absent; else echo present; fi); patch.recipient_guidance: $(if [ "$UNDER_PATCH" = "null" ]; then echo absent; else echo present; fi)"
        GUIDANCE="$TOP"
        if [ "$GUIDANCE" = "null" ]; then
          GUIDANCE="$UNDER_PATCH"
        fi
        if [ "$GUIDANCE" = "null" ]; then
          record fail "$ROW"
          exit 0
        fi

        # 4. the guidance against the schema: one line per problem
        step "checking the guidance against $SCHEMA"
        RC=0
        PROBLEMS="$(ev jq -r --slurpfile schema "$SCHEMA" --arg name recipient_guidance -f "$GITHUB_ACTION_PATH/../../../lib/schema.jq" <<<"$GUIDANCE")" || RC=$?
        if [ "$RC" -ne 0 ]; then
          record fail "$ROW; jq exit: $RC"
          exit 0
        fi

        # 5. a keyword of the schema this check cannot evaluate: the guidance is never called valid
        UNHANDLED="$(grep '^unhandled keyword: ' <<<"$PROBLEMS" | sed 's/^unhandled keyword: //' || true)"
        PROBLEMS="$(grep -v '^unhandled keyword: ' <<<"$PROBLEMS" || true)"
        ROW="$ROW; problems against the schema: $(counted "$PROBLEMS")"
        if [ -n "$UNHANDLED" ]; then
          record fail "$ROW; schema keywords not checked: $(counted "$UNHANDLED")"
          exit 0
        fi

        # 6. the verdict on the keywords it checks
        if [ -z "$PROBLEMS" ]; then
          record pass "$ROW"
        else
          record fail "$ROW"
        fi
