name: SRC-002.REQ-001
description: "SRC-002.REQ-001 (SRC-002 0.1.0): Backport evidence must link to the upstream commit, commit range, pull request, advisory, or release note defining the fix"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: SRC-002.REQ-001
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is SRC-002 0.1.0 SRC-002.REQ-001 SRC-002.CHECK-001
        F=.osera/patch-evidence.yaml
        expect "each fix has a CVE, an https upstream_fix_url or advisory_url, and a GitHub patch_commit_url"

        # The standard names upstream_fix_url and patch_commit_url as the check's evidence; advisory_url is ours, for an
        # upstream advisory when no upstream commit is public (Francesco, 19 Oct 2026: all three, one link filled). A
        # file that uses none of the three keeps the earlier rule, the https link under upstream. The links are checked
        # by their shape, not opened: the check is that a link is present (SRC-002.CHECK-001, partially automated). A
        # fix without a CVE passes the check and gets a row of ours, CP-NOTE-003, fail advisory: the standard lists
        # the vulnerability identifier as a SHOULD of the evidence.

        # 1. the evidence file must be in the repository at the tag
        step "reading $F"
        if [ ! -f "$F" ]; then
          record fail "$F: absent"
          exit 1
        fi

        # 2. one line per fix, tab separated, - for a value that is missing or empty: the CVE, upstream_fix_url,
        #    advisory_url, patch_commit_url, not_applicable_rationale, upstream
        FIXES="$(ev yq -r '.fixes // [] | .[] | [(.cve // "-"), (.upstream_fix_url // "-"), (.advisory_url // "-"), (.patch_commit_url // "-"), (.not_applicable_rationale // "-"), (.upstream // "-")] | map(select(. != "") // "-") | @tsv' "$F")"
        if [ -z "$FIXES" ]; then
          record fail "fixes: 0"
          exit 1
        fi
        N="$(wc -l <<<"$FIXES" | tr -d ' ')"

        # 3. which rule: the new fields anywhere in the file, or the earlier upstream field
        NEW="$(awk -F'\t' '$2 != "-" || $3 != "-" || $4 != "-" {print "yes"; exit}' <<<"$FIXES")"
        if [ "$NEW" != yes ]; then
          expect "each fix has a CVE and an https upstream link"
        fi

        # 4. each fix against its rule: one line per fix, the fix named by its CVE, or by its first link when it has
        #    no CVE, then what it lacks (empty when it has them all; several lacks joined by "and", so the list of
        #    fixes keeps its commas)
        #    A compare URL may start one commit before the first one it names, written <a>^ or <a>~1: the same commit on
        #    GitHub, and ~1 for a producer whose tools refuse ^ in a URL, as Java's URI parser does (Moderne, 21 Oct 2026)
        if [ "$NEW" = yes ]; then
          JUDGED="$(awk -F'\t' '
            {
              name = $1
              if (name == "-") {
                name = ($2 != "-") ? $2 : (($3 != "-") ? $3 : $4)
              }
              why = ""
              if ($2 == "-" && $3 == "-") {
                why = why " and lacks upstream_fix_url or advisory_url"
              }
              if ($2 != "-" && $2 !~ /^https:\/\//) {
                why = why " and upstream_fix_url not https"
              }
              if ($3 != "-" && $3 !~ /^https:\/\//) {
                why = why " and advisory_url not https"
              }
              if ($4 == "-" && $5 == "-") {
                why = why " and lacks patch_commit_url or not_applicable_rationale"
              }
              if ($4 != "-" && $4 !~ /^https:\/\/github\.com\/[^\/]+\/[^\/]+\/(commit\/[0-9a-f]+|compare\/[0-9a-f]+(\^|~1)?\.\.\.[0-9a-f]+)$/) {
                why = why " and patch_commit_url not a GitHub commit or compare URL"
              }
              print name "\t" substr(why, 6)
            }' <<<"$FIXES")"
        else
          JUDGED="$(awk -F'\t' '
            {
              name = ($1 != "-") ? $1 : $6
              why = ($6 ~ /^https:\/\//) ? "" : "lacks an https upstream link"
              print name "\t" why
            }' <<<"$FIXES")"
        fi
        WITH="$(awk -F'\t' '$2 == "" {print $1}' <<<"$JUDGED")"
        WITHOUT="$(awk -F'\t' '$2 != "" {print $1 " " $2}' <<<"$JUDGED")"

        # 5. the fixes that name no CVE: a SHOULD, a row of ours
        NOCVE="$(awk -F'\t' '$1 == "-" {print ($2 != "-") ? $2 : (($3 != "-") ? $3 : (($4 != "-") ? $4 : $6))}' <<<"$FIXES")"
        WITHCVE="$(awk -F'\t' '$1 != "-" {print $1}' <<<"$FIXES")"
        if [ -n "$NOCVE" ]; then
          extra CP-NOTE-003 fail "each fix names a CVE" "fixes: $N; with a CVE: $(counted "$WITHCVE"); without a CVE: $(counted "$NOCVE")"
        fi

        # 6. the verdict: a link missing fails; the fixes without their links are separated by "; " (Francesco, 30 Oct
        #    2026: "2 (CVE-2026-10050 lacks upstream_fix_url or advisory_url; CVE-2025-11143 patch_commit_url not a
        #    GitHub commit or compare URL)")
        if [ -n "$WITHOUT" ]; then
          record fail "fixes: $N; with them: $(counted "$WITH"); without them: $(counted "$WITHOUT" "; ")"
        else
          record pass "fixes: $N; with them: $(counted "$WITH"); without them: none"
        fi
