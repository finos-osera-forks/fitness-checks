name: FORK-001.REQ-002
description: "FORK-001.REQ-002 (FORK-001 0.1.0): Patched-source repositories must use the prefix patch- followed by the upstream repository or artifact name"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: FORK-001.REQ-002
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is FORK-001 0.1.0 FORK-001.REQ-002 FORK-001.CHECK-002
        NAME="${OSERA_REPOSITORY##*/}"
        expect "name starts with patch-"

        # 1. the upstream repository the fork was made from, for the row: none when the run context says the
        #    repository is not a fork, else from the API. The suffix is not compared with an artifact here: the gate
        #    names the fork from the pom and the declaration, and looks for that name.
        if [ -n "$OSERA_IS_FORK" ]; then
          given github.event.repository.fork "$OSERA_IS_FORK"
        fi
        if [ "$OSERA_IS_FORK" = "false" ]; then
          PARENT="none"
        else
          step "reading the fork parent from the GitHub API"
          PARENT="$(ev gh api "repos/$OSERA_REPOSITORY" --jq '.parent.full_name // "none"')"
        fi

        # 2. the name must start with patch-
        case "$NAME" in
          patch-?*)
            ;;
          *)
            record fail "name: $NAME; parent: $PARENT"
            exit 1
            ;;
        esac

        # 3. the name should not include osera (a SHOULD NOT of FORK-001): the check passes on the prefix, and a
        #    row of ours, CP-NOTE-001, fail advisory, says so
        if grep -qi osera <<<"$NAME"; then
          extra CP-NOTE-001 fail "name without osera" "name: $NAME"
        fi

        # 4. the row
        record pass "name: $NAME; parent: $PARENT"
