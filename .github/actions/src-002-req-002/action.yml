name: SRC-002.REQ-002
description: "SRC-002.REQ-002 (SRC-002 0.1.0): Backported commits carrying upstream-authored code should name the upstream commit and include a Co-authored-by trailer for the upstream author (SHOULD, advisory)"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: SRC-002.REQ-002
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is SRC-002 0.1.0 SRC-002.REQ-002 SRC-002.CHECK-002
        expect "each commit naming an upstream commit has a Co-authored-by trailer"

        # 1. without the baseline tag there is no range to look at: the check stops and is recorded as fail (failed step)
        step "resolving the baseline tag $BASE"
        ev git rev-parse -q --verify "refs/tags/${BASE}^{commit}" >/dev/null

        # 2. the commits in the range, and those whose message names an upstream commit; a producer may name it in a
        #    trailer, Upstream-Commit: <id> (Moderne's fix commits in patch-jackson-databind, read 16 Oct 2026)
        step "reading the commits between $BASE and $OSERA_TAG"
        TOTAL="$(ev git rev-list --count "${BASE}..${OSERA_TAG}")"
        CARRYING="$(ev git log --format=%H "${BASE}..${OSERA_TAG}" -i --extended-regexp --grep='(cherry picked from commit|backport of|upstream commit|upstream-commit:|upstream:) *[0-9a-f]{7,40}')"
        if [ -z "$CARRYING" ]; then
          record "not applicable" "commits: $TOTAL; naming an upstream commit: 0"
          exit 0
        fi
        NAMING="$(wc -l <<<"$CARRYING" | tr -d ' ')"

        # 3. each of those must carry a Co-authored-by trailer with a value (a SHOULD: the standard makes this check
        #    advisory, so a fail here never changes the result nor blocks at the gate)
        WITH=""
        WITHOUT=""
        for C in $CARRYING; do
          MSG="$(ev git log -1 --format=%B "$C")"
          if grep -qE '^Co-authored-by: *[^ ]' <<<"$MSG"; then
            WITH+=$'\n'"${C:0:12}"
          else
            WITHOUT+=$'\n'"${C:0:12}"
          fi
        done

        # 4. the verdict
        ROW="commits: $TOTAL; naming an upstream commit: $NAMING; with the trailer: $(counted "$WITH"); without the trailer: $(counted "$WITHOUT")"
        if [ -n "$WITHOUT" ]; then
          record fail "$ROW"
        else
          record pass "$ROW"
        fi
