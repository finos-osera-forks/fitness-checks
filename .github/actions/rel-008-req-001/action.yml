name: REL-008.REQ-001 (observe)
description: "REL-008.REQ-001 (REL-008 0.0.1): Patch providers should run build-security scanning appropriate to the package ecosystem before publishing an official patched artifact. Observe only: reported, never fails the run"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: REL-008.REQ-001 (observe)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is REL-008 0.0.1 REL-008.REQ-001 REL-008.CHECK-001
        F=.osera/patch-evidence.yaml
        expect "$F has build_security_scan_tool, scan_scope and scan_result"

        # Our proposal, the standard defines no field: the scan is looked for under the names of the check's evidence in
        # the standard (build_security_scan_tool, scan_scope, scan_result), at any depth of the file. The evidence format
        # is not defined, so a value is never judged: the check passes when all three are there, and fails naming the
        # absent ones (Francesco, 30 Oct 2026), severity observe.

        # 1. the evidence file must be in the repository at the tag
        step "reading $F"
        if [ ! -f "$F" ]; then
          record fail "$F: absent"
          exit 0
        fi

        # 2. every key used in the file, then the three names looked for, each with its value (a string without its quotes, anything else as JSON) or absent
        KEYS="$(ev yq -r '[.. | select(tag == "!!map") | keys | .[]] | unique | .[]' "$F")"
        ROW=""
        ABSENT=0
        for K in build_security_scan_tool scan_scope scan_result; do
          if grep -qxF "$K" <<<"$KEYS"; then
            V="$(K="$K" yq -o=json -I=0 '[.. | select(tag == "!!map" and has(env(K))) | .[env(K)]] | if length == 1 then .[0] else . end' "$F")"
            if [[ "$V" == \"*\" ]]; then
              V="${V#\"}"
              V="${V%\"}"
            fi
          else
            V="absent"
            ABSENT=$((ABSENT + 1))
          fi
          ROW="$ROW; $K: $V"
        done

        # 3. the verdict: all three fields, or a fail naming the absent ones
        if [ "$ABSENT" -eq 0 ]; then
          record pass "${ROW#; }"
        else
          record fail "${ROW#; }"
        fi
