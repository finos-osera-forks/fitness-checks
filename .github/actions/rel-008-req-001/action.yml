name: REL-008.REQ-001 (observe)
description: "REL-008.REQ-001 (REL-008 0.0.1): Patch providers should run build-security scanning appropriate to the package ecosystem before publishing an official patched artifact. Observe only: kept out of the result, never fails the run"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: REL-008.REQ-001 (observe)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is REL-008 0.0.1 REL-008.REQ-001 REL-008.CHECK-001
        F=.osera/patch-evidence.yaml
        expect "$F records the build security scan of $OSERA_TAG: the tool or manual review method, the scan scope and the scan result"

        # Our proposal, the standard defines no field: the scan is looked for under the names of the check's evidence in
        # the standard (build_security_scan_tool, scan_scope, scan_result), at any depth of the file. The evidence format
        # is not defined, so a value is never judged: found, the row asks for a person to review it; not found, the
        # check could not be tested. Either way the row is a fail with the reason, severity observe: it never changes
        # the result.
        WHY="the working group has not defined the scanning expectations nor the evidence format (REL-008, observe mode rationale)"

        # 1. the evidence file must be in the repository at the tag
        step "reading $F"
        if [ ! -f "$F" ]; then
          record fail "not tested: $F is not in the repository at $OSERA_TAG; $WHY"
          exit 0
        fi

        # 2. every key used in the file, then the three names looked for
        KEYS="$(ev yq -r '[.. | select(tag == "!!map") | keys | .[]] | unique | .[]' "$F")"
        FOUND=""
        MISSING=""
        for K in build_security_scan_tool scan_scope scan_result; do
          if grep -qxF "$K" <<<"$KEYS"; then
            FOUND="$FOUND $K=$(K="$K" yq -o=json -I=0 '[.. | select(tag == "!!map" and has(env(K))) | .[env(K)]]' "$F")"
          else
            MISSING="$MISSING $K"
          fi
        done

        # 3. the verdict
        if [ -z "$FOUND" ]; then
          record fail "not tested: $WHY; $F has none of build_security_scan_tool, scan_scope, scan_result"
        else
          record fail "manual evidence required: scan evidence found:$FOUND; missing:${MISSING:- none}; $WHY, so the values are shown, not judged"
        fi
