name: FORK-002.REQ-001
description: "FORK-002.REQ-001 (FORK-002 0.1.0): Patch providers must create version-scoped source workflow branches using patch/<version>"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: FORK-002.REQ-001
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is FORK-002 0.1.0 FORK-002.REQ-001 FORK-002.CHECK-001
        expect "branch patch/$VERSION, patch/$LINE or patch/$MAJOR contains $OSERA_TAG"

        # 1. the commit the release tag names
        REL_SHA="$(ev git rev-parse "refs/tags/${OSERA_TAG}^{commit}")"

        # 2. the patch branches that contain the release tag, among the three names the standard allows: the version
        #    itself, the minor line (patch/5.3.x) or the major line (patch/5.x); <version> "SHOULD identify the major,
        #    minor, or maintenance line" (FORK-002; Francesco, 30 Oct 2026: patch/<major>.x is accepted)
        step "listing the patch branches"
        WITH_TAG="$(ev git branch -r --list "origin/patch/$VERSION" "origin/patch/$LINE" "origin/patch/$MAJOR" --contains "refs/tags/$OSERA_TAG")"
        WITH_TAG="$(sed 's/^[ *]*//' <<<"$WITH_TAG")"

        # 3. every branch with patch in its name, for the row when none matches
        ALL="$(ev git branch -r --list 'origin/*patch*')"
        ALL="$(sed 's/^[ *]*//' <<<"$ALL")"

        # 4. one matching branch is enough
        if [ -n "$WITH_TAG" ]; then
          record pass "branch: $(listed "$WITH_TAG"); tag: $OSERA_TAG; commit: $REL_SHA"
        else
          record fail "branch: none; tag: $OSERA_TAG; commit: $REL_SHA; branches with patch in the name: $(counted "$ALL")"
        fi
