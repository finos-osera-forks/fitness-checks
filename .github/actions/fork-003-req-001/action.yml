name: FORK-003.REQ-001
description: "FORK-003.REQ-001 (FORK-003 0.1.0): Patch providers must tag the unpatched baseline source commit using v<VERSION>+patch.baseline"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: FORK-003.REQ-001
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is FORK-003 0.1.0 FORK-003.REQ-001 FORK-003.CHECK-001
        F=.osera/patch-evidence.yaml
        expect "tag $BASE at a commit before $OSERA_TAG"

        # 1. the release commit, and the baseline tag, which must exist
        REL_SHA="$(ev git rev-parse "refs/tags/${OSERA_TAG}^{commit}")"
        step "listing the baseline tags"
        TAGS="$(ev git tag --list "$BASE" '*baseline*')"
        if ! grep -qxF "$BASE" <<<"$TAGS"; then
          record fail "baseline tag: none; tags with baseline in the name: $(counted "$TAGS"); release tag: $OSERA_TAG; release commit: $REL_SHA"
          exit 1
        fi

        # 2. the baseline commit
        BASE_SHA="$(ev git rev-parse "refs/tags/${BASE}^{commit}")"
        ROW="baseline tag: $BASE; baseline commit: $BASE_SHA; release tag: $OSERA_TAG; release commit: $REL_SHA"

        # 3. the evidence file's baseline line, when it has one, names the same tag: a SHOULD of FORK-003, so the
        #    check passes on the tag and a row of ours, CP-NOTE-002, fail advisory, says what the file names; a
        #    file or a line that is not there is not flagged
        if [ -f "$F" ]; then
          step "reading the baseline line of $F"
          NAMED="$(ev yq -r '.baseline // ""' "$F")"
          if [ -n "$NAMED" ] && [ "$NAMED" != "$BASE" ]; then
            extra CP-NOTE-002 fail "baseline in $F: $BASE" "baseline in $F: $NAMED"
          fi
        fi

        # 4. the baseline must come before the release, on the same history
        if [ "$BASE_SHA" = "$REL_SHA" ]; then
          record fail "$ROW; commits between: 0"
        elif ev git merge-base --is-ancestor "$BASE_SHA" "$REL_SHA" >/dev/null; then
          N="$(ev git rev-list --count "$BASE_SHA..$REL_SHA")"
          record pass "$ROW; commits between: $N"
        else
          record fail "$ROW; commits between: none, the baseline is not an ancestor of the release"
        fi
