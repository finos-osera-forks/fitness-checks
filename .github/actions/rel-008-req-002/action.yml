name: REL-008.REQ-002 (observe)
description: "REL-008.REQ-002 (REL-008 0.0.1): Build-security evidence should identify unresolved high-risk findings or explain why the selected tooling is not applicable to the patched project. Observe only: reported, never fails the run"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: REL-008.REQ-002 (observe)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is REL-008 0.0.1 REL-008.REQ-002 REL-008.CHECK-002
        F=.osera/patch-evidence.yaml
        expect "$F has unresolved_findings and finding_disposition, or not_applicable_rationale"

        # Our proposal, the standard defines no field: the findings are looked for under the names of the check's evidence
        # in the standard (unresolved_findings, finding_disposition, not_applicable_rationale), at any depth of the file
        # outside the fixes list: a fix's not_applicable_rationale is an SRC-002 note on that fix, not a scan disposition
        # (Francesco, 19 Oct 2026). The evidence format is not defined, so a value is never judged: the check passes
        # when unresolved_findings and finding_disposition are there, or not_applicable_rationale is (Francesco,
        # 30 Oct 2026), severity observe.

        # 1. the evidence file must be in the repository at the tag
        step "reading $F"
        if [ ! -f "$F" ]; then
          record fail "$F: absent"
          exit 0
        fi

        # 2. every key used in the file outside the fixes list, then the three names looked for, each with its value (a string without its quotes, anything else as JSON) or absent
        KEYS="$(ev yq -r 'del(.fixes) | [.. | select(tag == "!!map") | keys | .[]] | unique | .[]' "$F")"
        ROW=""
        FOUND=""
        for K in unresolved_findings finding_disposition not_applicable_rationale; do
          if grep -qxF "$K" <<<"$KEYS"; then
            FOUND="$FOUND $K"
            V="$(K="$K" yq -o=json -I=0 'del(.fixes) | [.. | select(tag == "!!map" and has(env(K))) | .[env(K)]] | if length == 1 then .[0] else . end' "$F")"
            if [[ "$V" == \"*\" ]]; then
              V="${V#\"}"
              V="${V%\"}"
            fi
          else
            V="absent"
          fi
          ROW="$ROW; $K: $V"
        done

        # 3. the verdict: the findings with their disposition, or the rationale for no scan
        case "$FOUND" in
          *unresolved_findings*finding_disposition*|*not_applicable_rationale*)
            record pass "${ROW#; }"
            ;;
          *)
            record fail "${ROW#; }"
            ;;
        esac
