name: CP-REL-004-01
description: "CP-REL-004-01 (REL-004 0.1.0): a check of ours (remediation-standards 52), not a requirement on the site: the evidence file has a producer line. Advisory, never fails the run"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: CP-REL-004-01
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is REL-004 0.1.0 CP-REL-004-01 ""
        F=.osera/patch-evidence.yaml
        expect "evidence file has a producer line"

        # 1. the evidence file must be in the repository at the tag (a check of ours: a fail is advisory, never the run's)
        step "reading $F"
        if [ ! -f "$F" ]; then
          record fail "$F: absent"
          exit 0
        fi

        # 2. the producer line
        P="$(ev yq -r '.producer // ""' "$F")"
        if [ -n "$P" ]; then
          record pass "producer: $P"
        else
          record fail "producer: absent"
        fi
