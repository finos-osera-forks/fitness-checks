name: REL-006.REQ-001 (observe)
description: "REL-006.REQ-001 (REL-006 0.0.1): Patch releases should identify the backlog item, public request, sponsor record, or equivalent authorization record for the patched coordinate and line. Observe only: reported, never fails the run"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: REL-006.REQ-001 (observe)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is REL-006 0.0.1 REL-006.REQ-001 REL-006.CHECK-001
        F=.osera/patch-evidence.yaml
        expect "$F has backlog_item or sponsor_record"

        # Our proposal, the standard defines no field: the record is looked for under the names of the check's evidence
        # in the standard (backlog_item, sponsor_record), at any depth of the file. The model is not settled, so a value
        # is never judged: the check passes when either field is there (Francesco, 30 Oct 2026), severity observe.

        # 1. the evidence file must be in the repository at the tag
        step "reading $F"
        if [ ! -f "$F" ]; then
          record fail "$F: absent"
          exit 0
        fi

        # 2. the patched coordinates, as evidence
        ev yq -r '[.fixes // [] | .[] | .artifacts // [] | .[]] | unique | join(",")' "$F" >/dev/null

        # 3. every key used in the file, then the two names looked for, each with its value (a string without its quotes, anything else as JSON) or absent
        KEYS="$(ev yq -r '[.. | select(tag == "!!map") | keys | .[]] | unique | .[]' "$F")"
        ROW=""
        PRESENT=0
        for K in backlog_item sponsor_record; do
          if grep -qxF "$K" <<<"$KEYS"; then
            PRESENT=$((PRESENT + 1))
            V="$(K="$K" yq -o=json -I=0 '[.. | select(tag == "!!map" and has(env(K))) | .[env(K)]] | if length == 1 then .[0] else . end' "$F")"
            if [[ "$V" == \"*\" ]]; then
              V="${V#\"}"
              V="${V%\"}"
            fi
          else
            V="absent"
          fi
          ROW="$ROW; $K: $V"
        done

        # 4. the verdict: one of the two fields is enough
        if [ "$PRESENT" -gt 0 ]; then
          record pass "${ROW#; }"
        else
          record fail "${ROW#; }"
        fi
